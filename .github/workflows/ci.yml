# Builds the x64 package on every push and pull request so packaging breaks are caught before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build x64 package
        shell: pwsh
        run: ./build-package.ps1 -Version 0.0.0.0 -Platforms x64

      - name: Validate gallery listing
        shell: pwsh
        run: ./tools/Test-GalleryListing.ps1
